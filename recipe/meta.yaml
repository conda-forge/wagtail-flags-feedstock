{% set name = "wagtail-flags" %}
{% set version = "5.6.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/wagtail_flags-{{ version }}.tar.gz
  sha256: facc1abe9e85cf0e1412defe1cc753da19e081b7603cfdcabd0da023e1ea6753

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=63
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }},<4.0
    - wagtail >=7.0
    - django-flags >5

test:
  imports:
    - wagtailflags
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Feature flags for Wagtail sites
  home: https://github.com/cfpb/wagtail-flags
  license: CC0-1.0
  license_file: LICENSE
  dev_url: https://github.com/cfpb/wagtail-flags

extra:
  recipe-maintainers:
    - rxm7706
